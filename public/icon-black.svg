      <path fill="#fff" d="M27.9 24.3H45.7A25.2 19.9 0 0 1 70.9 44.2V58A25.2 20.8 0 0 1 45.7 78.8H27.9Z" />
      <g fill="#000" clip-path="url(#counter)">
        <path d="M30 26H50.46L30 53.9Z" />
        <path d="M39.25 46.6L55 26H69V35.67Z" />
        <path d="M50.9 47.25L69 40.87V51.37Z" />
