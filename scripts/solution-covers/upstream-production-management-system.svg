<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 800" fill="none">
  <!-- Two wellheads, flowlines into a separator, a meter, and a report with one deferred bar. -->
  <rect width="1360" height="800" fill="#f3eee2"/>
  <g stroke="#171207" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80 660h700"/>
    <!-- wellhead 1 -->
    <path d="M220 660V450"/>
    <rect x="196" y="540" width="48" height="40" fill="#fffdf7"/>
    <rect x="200" y="470" width="40" height="30" fill="#fffdf7"/>
    <path d="M180 520h80M220 450V420"/>
    <circle cx="220" cy="410" r="16" fill="#ffc933"/>
    <path d="M260 520h40v100" stroke-dasharray="10 10"/>
    <!-- wellhead 2 -->
    <path d="M430 660V450"/>
    <rect x="406" y="540" width="48" height="40" fill="#fffdf7"/>
    <rect x="410" y="470" width="40" height="30" fill="#fffdf7"/>
    <path d="M390 520h80M430 450V420"/>
    <circle cx="430" cy="410" r="16" fill="#fffdf7"/>
    <path d="M470 520h30v100" stroke-dasharray="10 10"/>
    <!-- flowline header -->
    <path d="M300 620h260M500 620v0"/>
    <!-- separator vessel -->
    <rect x="560" y="360" width="130" height="300" rx="62" fill="#fffdf7"/>
    <path d="M560 540h130"/>
    <path d="M560 540h130v36a62 62 0 0 1-62 84h-6a62 62 0 0 1-62-84z" fill="#ffc933"/>
    <path d="M625 360v-40M600 320h50"/>
    <!-- outlet and meter -->
    <path d="M690 500h54"/>
    <circle cx="780" cy="500" r="36" fill="#fffdf7"/>
    <path d="M780 500l16-18M758 520h44"/>
    <path d="M816 500h84m-16-16 16 16-16 16"/>
    <!-- report -->
    <rect x="920" y="230" width="330" height="420" fill="#fffdf7"/>
    <path d="M950 276h140M950 304h90"/>
    <path d="M950 600h270" stroke-width="4"/>
    <rect x="962" y="470" width="34" height="130" fill="#171207"/>
    <rect x="1018" y="440" width="34" height="160" fill="#171207"/>
    <rect x="1074" y="500" width="34" height="100" fill="#ffc933"/>
    <path d="M1074 440h34v60h-34z" stroke-dasharray="8 8"/>
    <rect x="1130" y="450" width="34" height="150" fill="#171207"/>
    <rect x="1186" y="430" width="34" height="170" fill="#171207"/>
  </g>
</svg>
